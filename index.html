<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#ff5f9e,#ff7db8);
}

.container{
    text-align:center;
    z-index:10;
}

.envelope{
    width:280px;
    height:180px;
    position:relative;
    margin:auto;
    cursor:pointer;
}

.envelope-base{
    width:100%;
    height:100%;
    background:#ff8fab;
    border-radius:12px;
    position:absolute;
    bottom:0;
    left:0;
}

.flap{
    width:0;
    height:0;
    border-left:140px solid transparent;
    border-right:140px solid transparent;
    border-top:90px solid #ff4d6d;
    position:absolute;
    top:0;
    left:0;
    transform-origin:top;
    transition:1s;
    z-index:5;
}

.letter{
    position:absolute;
    left:15px;
    bottom:10px;
    width:250px;
    height:140px;
    background:white;
    border-radius:10px;
    padding:15px;
    overflow:hidden;
    transition:1s;
    z-index:1;
}

.letter h3{
    color:#ff4d6d;
    margin-bottom:10px;
}

.letter p{
    color:#444;
    font-size:14px;
    line-height:1.4;
}

.open .flap{
    transform:rotateX(180deg);
}

.open .letter{
    transform:translateY(-120px);
}

.instruction{
    margin-top:30px;
    color:white;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:14px 30px;
    border:none;
    border-radius:40px;
    background:white;
    color:#ff4d6d;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    opacity:0;
    transition:.5s;
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    justify-content:center;
    align-items:center;
    z-index:100;
}

.popup-card{
    width:90%;
    max-width:400px;
    background:white;
    border-radius:20px;
    padding:25px;
    text-align:center;
}

.popup-card h2{
    color:#ff4d6d;
    margin-bottom:15px;
}

.popup-card p{
    color:#555;
    line-height:1.7;
}

.close{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
}

.heart{
    position:absolute;
    color:white;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
    }
    to{
        transform:translateY(-100px);
    }
}

</style>
</head>

    <div class="envelope" id="envelope" onclick="openEnvelope()">

        <div class="letter">
            <
